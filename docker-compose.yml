services:
  postgres:
    image: postgres:16-alpine
    container_name: bookd-postgres
    restart: always
    environment:
      POSTGRES_DB: bookd
      POSTGRES_USER: bookd
      POSTGRES_PASSWORD: bookd
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookd-network

  redis:
    image: redis:7-alpine
    container_name: bookd-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - bookd-network

  bookd-server:
    image: bookd:local
    container_name: bookd-server
    restart: always
    ports:
      - "7919:7919"
    environment:
      PORT: "7919"
      DATABASE_URL: "jdbc:postgresql://postgres:5432/bookd"
      DATABASE_USER: "bookd"
      DATABASE_PASSWORD: "bookd"
      REDIS_ENABLED: "true"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      TZ: "Asia/Shanghai"  # 时区设置，可根据需要修改为其他时区
      PARSE_AUTO_ON_SCAN: "false"
      PARSE_BACKGROUND_ENABLED: "true"
      PARSE_BACKGROUND_INTERVAL: "60"
      PARSE_BACKGROUND_BATCH_SIZE: "5"
    # Memory and resource limits
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    volumes:
      # 书籍封面持久化存储
      - covers_data:/app/covers
      
      # 书籍内部图片持久化存储
      - book_images_data:/app/book_images
      
      # NAS 全目录挂载（推荐用于 NAS 部署）
      # 群晖 NAS: 取消下面两行注释
      # - /volume1:/volume1:ro
      # - /volume2:/volume2:ro
      
      # 威联通 NAS: 取消下面注释
      # - /share:/share:ro
      
      # Mac/Linux 开发环境: 取消下面注释
      - /Users:/Users:ro
    depends_on:
      - postgres
      - redis
    networks:
      - bookd-network

volumes:
  postgres_data:
  redis_data:
  covers_data:
  book_images_data:

networks:
  bookd-network:
    driver: bridge
