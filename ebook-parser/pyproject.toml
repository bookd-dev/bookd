[tool.poetry]
name = "epub-parser-service"
version = "0.1.0"
description = "EPUB parsing microservice using ebooklib for Bookd"
authors = ["Bookd Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
ebooklib = "^0.18"
Pillow = "^10.2.0"
pydantic = "^2.6.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
