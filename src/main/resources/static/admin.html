<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookd 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: white; padding: 30px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; color: #1a1a1a; font-weight: 700; }
        .subtitle { color: #666; font-size: 14px; margin-top: 8px; }
        .section { background: white; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 20px; color: #1a1a1a; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        .docker-hint {
            background: #e7f3ff;
            border: 1px solid #2196f3;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.6;
        }
        .docker-hint code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #667eea;
        }
        .input-wrapper { position: relative; display: flex; gap: 10px; }
        input[type="text"] { 
            flex: 1; padding: 12px 16px; border: 2px solid #e1e8ed; border-radius: 8px; 
            font-size: 14px; transition: all 0.3s;
        }
        input[type="text"]:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; 
            font-size: 14px; font-weight: 600; transition: all 0.3s;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4); }
        button:active { transform: translateY(0); }
        button.browse-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); box-shadow: 0 2px 4px rgba(17, 153, 142, 0.3); }
        button.browse-btn:hover { box-shadow: 0 4px 8px rgba(17, 153, 142, 0.4); }
        button.scan-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        button.scan-btn:hover { box-shadow: 0 4px 8px rgba(17, 153, 142, 0.4); }
        button.scan-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
        button.scanning { background: linear-gradient(135deg, #ffa500 0%, #ff6347 100%); animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .scanning-status { 
            display: inline-block; padding: 4px 12px; border-radius: 16px; 
            background: #fff3cd; color: #856404; font-size: 12px; font-weight: 600; 
            margin-left: 8px; animation: pulse 2s infinite;
        }
        button.danger { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 2px 4px rgba(245, 87, 108, 0.3); }
        button.danger:hover { box-shadow: 0 4px 8px rgba(245, 87, 108, 0.4); }
        button.secondary { background: #6c757d; box-shadow: 0 2px 4px rgba(108, 117, 125, 0.3); }
        button.secondary:hover { background: #5a6268; }
        .source-list { list-style: none; }
        .source-item { 
            padding: 20px; border: 2px solid #f0f2f5; border-radius: 12px; 
            margin-bottom: 12px; transition: all 0.3s; background: #fafbfc;
        }
        .source-item:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15); }
        .source-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .source-header:hover .source-name { color: #667eea; }
        .source-info { flex: 1; }
        .source-name { font-weight: 600; margin-bottom: 8px; font-size: 16px; color: #1a1a1a; }
        .source-path { 
            color: #666; font-size: 13px; font-family: 'Courier New', monospace;
            background: #f5f7fa; padding: 4px 8px; border-radius: 4px; display: inline-block;
        }
        .source-actions { display: flex; gap: 10px; align-items: center; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; margin-left: 8px; }
        .status-enabled { background: #d4edda; color: #155724; }
        .status-disabled { background: #f8d7da; color: #721c24; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .stat-card.clickable { cursor: pointer; }
        .stat-card.clickable:hover { border: 2px solid #667eea; }
        .stat-value { font-size: 42px; font-weight: 700; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stat-label { color: #666; font-size: 14px; margin-top: 8px; font-weight: 500; }
        .stat-hint { color: #999; font-size: 12px; margin-top: 4px; font-style: italic; }
        .empty-state { padding: 60px 40px; text-align: center; color: #999; }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
        .path-preview { font-size: 12px; color: #666; margin-top: 4px; font-style: italic; }
        .scan-all-btn { margin-bottom: 16px; }
        .source-books { 
            margin-top: 16px; padding-top: 16px; border-top: 2px dashed #e1e8ed; 
            display: none; 
        }
        .source-books.expanded { display: block; }
        .book-list { list-style: none; margin-top: 12px; }
        .book-item { 
            padding: 12px; background: white; border: 1px solid #e1e8ed; 
            border-radius: 8px; margin-bottom: 8px; font-size: 13px;
        }
        .book-title { font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
        .book-meta { color: #666; font-size: 12px; }
        .expand-icon { margin-left: 8px; font-size: 12px; transition: transform 0.3s; display: inline-block; }
        .expand-icon.expanded { transform: rotate(180deg); }
        
        /* 文件浏览器样式 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 800px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
        .modal-content.modal-large { max-width: 1200px; max-height: 85vh; }
        .modal-header { padding: 20px; border-bottom: 1px solid #e1e8ed; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: none; color: #666; font-size: 24px; padding: 0; width: 32px; height: 32px; border-radius: 50%; }
        .modal-close:hover { background: #f0f2f5; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 12px; background: #f5f7fa; border-radius: 8px; font-size: 13px; font-family: 'Courier New', monospace; }
        .breadcrumb-item { color: #667eea; cursor: pointer; }
        .breadcrumb-item:hover { text-decoration: underline; }
        .breadcrumb-separator { color: #999; }
        .file-list { list-style: none; }
        .file-item { display: flex; align-items: center; padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .file-item:hover { background: #f5f7fa; }
        .file-item.directory { font-weight: 500; }
        .file-icon { font-size: 20px; margin-right: 12px; }
        .file-name { flex: 1; }
        .file-select-btn { padding: 6px 16px; font-size: 13px; }
        .loading { text-align: center; padding: 40px; color: #999; }
        
        /* User management styles */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: white; padding: 8px; border-radius: 12px; }
        .nav-tab { flex: 1; padding: 12px; background: transparent; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: #666; transition: all 0.3s; }
        .nav-tab.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .user-list { list-style: none; }
        .user-item { padding: 16px; background: #fafbfc; border: 2px solid #f0f2f5; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .user-info .username { font-weight: 600; font-size: 15px; }
        .user-info .role { font-size: 13px; color: #666; margin-top: 4px; }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: 8px; }
        .role-admin { background: #ffd700; color: #856404; }
        .role-user { background: #d4edda; color: #155724; }
        .role-guest { background: #e2e3e5; color: #383d41; }
        .token-list { list-style: none; }
        .token-item { padding: 12px; background: #f5f7fa; border-radius: 6px; margin-bottom: 8px; font-family: 'Courier New', monospace; font-size: 13px; word-break: break-all; }
        .token-item.used { opacity: 0.5; text-decoration: line-through; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .user-info-badge { font-size: 14px; color: #667eea; font-weight: 600; }
        
        /* Book Grid Styles */
        .book-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            padding: 20px 0;
        }
        .book-card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            transition: all 0.3s;
            cursor: pointer;
        }
        .book-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 4px 16px rgba(0,0,0,0.2); 
        }
        .book-cover { 
            width: 100%; 
            height: 280px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: white;
            font-size: 48px;
            position: relative;
        }
        .book-cover img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .book-info { 
            padding: 16px;
            position: relative;
        }
        .book-card-title { 
            font-weight: 600; 
            font-size: 14px; 
            color: #1a1a1a; 
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .book-card-author { 
            color: #666; 
            font-size: 13px; 
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .book-card-time { 
            color: #999; 
            font-size: 11px;
        }
        .book-card-format {
            position: absolute;
            bottom: 16px;
            right: 16px;
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .source-item { flex-direction: column; gap: 16px; align-items: flex-start; }
            .source-actions { width: 100%; justify-content: flex-end; }
            .book-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-actions">
                <div>
                    <h1>📚 Bookd 电子书管理后台</h1>
                    <div class="subtitle">轻松管理您的电子书库 | <span class="user-info-badge" id="currentUser"></span></div>
                </div>
                <button class="danger" onclick="logout()">🚪 登出</button>
            </div>
        </header>
        
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('books')">📚 书籍管理</button>
            <button class="nav-tab" onclick="switchTab('users')">👥 用户管理</button>
        </div>
        
        <div id="books-tab" class="tab-pane active">
            <div class="stats">
                <div class="stat-card clickable" onclick="showAllBooks()">
                    <div class="stat-value" id="totalBooks">0</div>
                    <div class="stat-label">📖 图书总数</div>
                    <div class="stat-hint">点击查看所有书籍</div>
                </div>
                <div class="stat-card clickable" onclick="showBookSources()">
                    <div class="stat-value" id="totalSources">0</div>
                    <div class="stat-label">📁 书籍源</div>
                    <div class="stat-hint">点击管理书籍源</div>
                </div>
            </div>
        
        <div class="section">
            <h2>📁 添加书籍源</h2>
            <form id="addSourceForm">
                <div class="form-group">
                    <label>源名称</label>
                    <input type="text" id="sourceName" placeholder="例如：个人收藏、技术书籍、小说..." required>
                </div>
                <div class="form-group">
                    <label>文件路径</label>
                    <div class="docker-hint">
                        💡 <strong>NAS 用户提示：</strong> 
                        如已挂载整个 NAS 目录（如 <code>/volume1</code>），可直接浏览选择任意路径。
                        点击"📂 浏览文件夹"打开文件浏览器。
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="sourcePath" placeholder="/volume1/books  或  /data/books" required readonly>
                        <button type="button" class="browse-btn" onclick="openFileBrowser()">📂 浏览文件夹</button>
                    </div>
                    <div class="path-preview" id="pathPreview" style="display: none;"></div>
                </div>
                <button type="submit">➕ 添加书籍源</button>
            </form>
        </div>
    </div>
    
    <div id="users-tab" class="tab-pane">
        <div class="section">
            <h2>👥 用户列表</h2>
            <ul class="user-list" id="userList">
                <li class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div>加载中...</div>
                </li>
            </ul>
        </div>
        
        <div class="section">
            <h2>🎫 邀请码管理</h2>
            <p style="margin-bottom: 16px; color: #666; font-size: 14px;">
                生成邀请码供其他人注册为普通用户
            </p>
            <button onclick="generateInviteToken()">➕ 生成新邀请码</button>
            <ul class="token-list" id="tokenList" style="margin-top: 20px;">
                <li class="empty-state">
                    <div>暂无邀请码</div>
                </li>
            </ul>
        </div>
    </div>
</div>
    
    <!-- 文件浏览器模态框 -->
    <div id="fileBrowserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">📂 选择文件夹</div>
                <button class="modal-close" onclick="closeFileBrowser()">×</button>
            </div>
            <div class="modal-body">
                <div class="breadcrumb" id="breadcrumb"></div>
                <div id="fileListContainer">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Book Sources Modal -->
    <div id="bookSourcesModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <div class="modal-title">📚 书籍源管理</div>
                <button class="modal-close" onclick="closeBookSourcesModal()">×</button>
            </div>
            <div class="modal-body">
                <button class="scan-btn scan-all-btn" onclick="scanAllSources()">🔍 扫描所有书籍源</button>
                <ul class="source-list" id="sourceListModal">
                    <li class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div>加载中...</div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    
    <!-- All Books Modal -->
    <div id="allBooksModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <div class="modal-title">📖 所有书籍</div>
                <button class="modal-close" onclick="closeAllBooksModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="book-grid" id="bookGridContainer">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        let currentPath = '/';
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;
        let scanStatusCheckInterval = null;
        let isScanning = false;
        
        // Check authentication on page load
        async function checkAuth() {
            if (!authToken) {
                window.location.href = '/login';
                return false;
            }
            
            try {
                const res = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('currentUser').textContent = `${currentUser.username} (${getRoleText(currentUser.role)})`;
                    
                    // Check admin permission
                    if (currentUser.role !== 'admin') {
                        alert('您没有管理员权限\n即将跳转到阅读器页面');
                        setTimeout(() => {
                            window.location.href = '/reader';
                        }, 1000);
                        return false;
                    }
                    
                    return true;
                } else {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                    return false;
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/login';
                return false;
            }
        }
        
        function getRoleText(role) {
            switch(role) {
                case 'admin': return '管理员';
                case 'user': return '普通用户';
                case 'guest': return '访客';
                default: return role;
            }
        }
        
        function getRoleBadge(role) {
            switch(role) {
                case 'admin': return '<span class="role-badge role-admin">管理员</span>';
                case 'user': return '<span class="role-badge role-user">普通用户</span>';
                case 'guest': return '<span class="role-badge role-guest">访客</span>';
                default: return `<span class="role-badge">${role}</span>`;
            }
        }
        
        async function logout() {
            try {
                await fetch(`${API_BASE}/auth/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
            } catch (error) {
                console.error('Logout failed:', error);
            }
            
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
            
            if (tab === 'users') {
                loadUsers();
                loadInviteTokens();
            }
        }
        
        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/users`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const users = await res.json();
                
                const list = document.getElementById('userList');
                if (users.length === 0) {
                    list.innerHTML = '<li class="empty-state"><div>暂无用户</div></li>';
                    return;
                }
                
                list.innerHTML = users.map(user => `
                    <li class="user-item">
                        <div class="user-info">
                            <div class="username">${user.username} ${getRoleBadge(user.role)}</div>
                            <div class="role">${user.email || '未设置邮箱'}</div>
                        </div>
                        ${user.role !== 'admin' ? `<button class="danger" onclick="deleteUser(${user.id}, '${user.username}')">删除</button>` : ''}
                    </li>
                `).join('');
            } catch (error) {
                console.error('Failed to load users:', error);
            }
        }
        
        async function deleteUser(userId, username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    alert('用户已删除');
                    loadUsers();
                } else {
                    alert('删除失败');
                }
            } catch (error) {
                console.error('Failed to delete user:', error);
                alert('删除失败');
            }
        }
        
        async function generateInviteToken() {
            try {
                const res = await fetch(`${API_BASE}/users/invite-tokens`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    alert('邀请码生成成功');
                    loadInviteTokens();
                } else {
                    alert('生成失败');
                }
            } catch (error) {
                console.error('Failed to generate token:', error);
                alert('生成失败');
            }
        }
        
        async function loadInviteTokens() {
            try {
                const res = await fetch(`${API_BASE}/users/invite-tokens`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const tokens = await res.json();
                
                const list = document.getElementById('tokenList');
                if (tokens.length === 0) {
                    list.innerHTML = '<li class="empty-state"><div>暂无邀请码</div></li>';
                    return;
                }
                
                list.innerHTML = tokens.map(token => `
                    <li class="token-item ${token.used ? 'used' : ''}">
                        ${token.token} ${token.used ? '(已使用)' : '(未使用)'}
                    </li>
                `).join('');
            } catch (error) {
                console.error('Failed to load tokens:', error);
            }
        }
        
        // Initialize
        (async () => {
            const authed = await checkAuth();
            if (authed) {
                loadStats();
                // Book sources now shown in modal, not on page load
            }
        })();
        
        // Helper function for authenticated fetch
        async function apiFetch(url, options = {}) {
            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${authToken}`
            };
            return fetch(url, { ...options, headers });
        }
        
        function openFileBrowser() {
            document.getElementById('fileBrowserModal').classList.add('active');
            loadDirectory('/');
        }
        
        function closeFileBrowser() {
            document.getElementById('fileBrowserModal').classList.remove('active');
        }
        
        async function loadDirectory(path) {
            currentPath = path;
            const container = document.getElementById('fileListContainer');
            container.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const res = await fetch(`${API_BASE}/filesystem/list?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                
                // 更新面包屑
                updateBreadcrumb(data.currentPath);
                
                // 渲染文件列表
                const fileList = document.createElement('ul');
                fileList.className = 'file-list';
                
                // 添加返回上级
                if (data.parentPath) {
                    const parentItem = createFileItem({
                        name: '..',
                        path: data.parentPath,
                        isDirectory: true
                    }, true);
                    fileList.appendChild(parentItem);
                }
                
                // 添加目录
                data.directories.forEach(dir => {
                    fileList.appendChild(createFileItem(dir, false));
                });
                
                container.innerHTML = '';
                container.appendChild(fileList);
                
                if (data.directories.length === 0 && !data.parentPath) {
                    container.innerHTML = '<div class="empty-state"><div>该目录为空</div></div>';
                }
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><div style="color: #dc3545;">加载失败: ${e.message}</div></div>`;
            }
        }
        
        function createFileItem(item, isParent) {
            const li = document.createElement('li');
            li.className = 'file-item directory';
            
            const icon = document.createElement('span');
            icon.className = 'file-icon';
            icon.textContent = isParent ? '⬆️' : '📁';
            
            const name = document.createElement('span');
            name.className = 'file-name';
            name.textContent = item.name;
            
            const selectBtn = document.createElement('button');
            selectBtn.className = 'file-select-btn';
            selectBtn.textContent = '选择';
            selectBtn.onclick = (e) => {
                e.stopPropagation();
                selectPath(item.path);
            };
            
            li.appendChild(icon);
            li.appendChild(name);
            if (!isParent) {
                li.appendChild(selectBtn);
            }
            
            li.onclick = () => {
                if (item.isDirectory) {
                    loadDirectory(item.path);
                }
            };
            
            return li;
        }
        
        function updateBreadcrumb(path) {
            const breadcrumb = document.getElementById('breadcrumb');
            const parts = path.split('/').filter(p => p);
            
            let html = '<span class="breadcrumb-item" onclick="loadDirectory(\'/\')">根目录</span>';
            
            let accumulated = '';
            parts.forEach((part, index) => {
                accumulated += '/' + part;
                const currentPath = accumulated;
                html += '<span class="breadcrumb-separator">/</span>';
                html += `<span class="breadcrumb-item" onclick="loadDirectory('${currentPath}')">${part}</span>`;
            });
            
            breadcrumb.innerHTML = html;
        }
        
        function selectPath(path) {
            document.getElementById('sourcePath').value = path;
            closeFileBrowser();
            
            const preview = document.getElementById('pathPreview');
            preview.textContent = `✅ 已选择: ${path}`;
            preview.style.display = 'block';
            preview.style.color = '#28a745';
        }
        
        // Book Sources Modal Functions
        function showBookSources() {
            document.getElementById('bookSourcesModal').classList.add('active');
            loadSourcesModal();
        }
        
        function closeBookSourcesModal() {
            document.getElementById('bookSourcesModal').classList.remove('active');
        }
        
        async function loadSourcesModal() {
            try {
                const res = await fetch(`${API_BASE}/sources`);
                const sources = await res.json();
                const list = document.getElementById('sourceListModal');
                
                if (sources.length === 0) {
                    list.innerHTML = `<li class="empty-state"><div class="empty-state-icon">📭</div><div>暂无书籍源，请添加第一个书籍源</div></li>`;
                    return;
                }
                
                list.innerHTML = sources.map(source => `
                    <li class="source-item" data-source-id="${source.id}">
                        <div class="source-header" onclick="toggleBooks(${source.id})">
                            <div class="source-info">
                                <div class="source-name">
                                    ${escapeHtml(source.name)}
                                    <span class="status-badge ${source.enabled ? 'status-enabled' : 'status-disabled'}">
                                        ${source.enabled ? '✓ 已启用' : '✗ 已禁用'}
                                    </span>
                                    <span class="expand-icon" id="icon-${source.id}">▼</span>
                                </div>
                                <div class="source-path">${escapeHtml(source.path)}</div>
                            </div>
                            <div class="source-actions" onclick="event.stopPropagation()">
                                <button class="scan-btn" onclick="scanSource(${source.id})">🔍 扫描</button>
                                <button class="secondary" onclick="toggleSource(${source.id})">
                                    ${source.enabled ? '⏸ 禁用' : '▶ 启用'}
                                </button>
                                <button class="danger" onclick="deleteSource(${source.id})">🗑️ 删除</button>
                            </div>
                        </div>
                        <div class="source-books" id="books-${source.id}">
                            <div class="loading">加载中...</div>
                        </div>
                    </li>
                `).join('');
            } catch (e) {
                console.error('Failed to load sources', e);
                list.innerHTML = `<li class="empty-state"><div class="empty-state-icon">⚠️</div><div style="color: #dc3545;">加载失败，请刷新重试</div></li>`;
            }
        }
        
        // All Books Modal Functions
        function showAllBooks() {
            document.getElementById('allBooksModal').classList.add('active');
            loadAllBooksGrid();
        }
        
        function closeAllBooksModal() {
            document.getElementById('allBooksModal').classList.remove('active');
        }
        
        async function loadAllBooksGrid() {
            const container = document.getElementById('bookGridContainer');
            container.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const res = await fetch(`${API_BASE}/books?limit=500`);
                const data = await res.json();
                const books = data.books || [];
                
                if (books.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>暂无书籍</div></div>';
                    return;
                }
                
                container.innerHTML = books.map(book => {
                    const formatIcon = getFormatIcon(book.format);
                    const timeStr = formatTime(book);
                    
                    return `
                        <div class="book-card" onclick="viewBookDetail(${book.id})">
                            <div class="book-cover">
                                ${book.coverPath ? `<img src="${book.coverPath}" alt="${escapeHtml(book.title)}">` : formatIcon}
                            </div>
                            <div class="book-info">
                                <div class="book-card-title">${escapeHtml(book.title)}</div>
                                <div class="book-card-author">👤 ${escapeHtml(book.author || '未知作者')}</div>
                                <div class="book-card-time">📅 ${timeStr}</div>
                                <div class="book-card-format">${escapeHtml(book.format || '')}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><div style="color: #dc3545;">加载失败: ${e.message}</div></div>`;
            }
        }
        
        function getFormatIcon(format) {
            const icons = {
                'epub': '📕',
                'pdf': '📄',
                'mobi': '📗',
                'azw3': '📘',
                'txt': '📃'
            };
            return icons[format?.toLowerCase()] || '📚';
        }
        
        function formatTime(book) {
            // Assuming the book has updatedAt or createdAt field
            // For now, just return a placeholder
            return '最近更新';
        }
        
        function viewBookDetail(bookId) {
            // TODO: Implement book detail view
            alert(`查看书籍详情 ID: ${bookId}`);
        }
        
        async function loadStats() {
            try {
                // Use the new count API endpoint
                const countRes = await fetch(`${API_BASE}/books/count`);
                const countData = await countRes.json();
                document.getElementById('totalBooks').textContent = countData.count || 0;
                
                const sourcesRes = await fetch(`${API_BASE}/sources`);
                const sourcesData = await sourcesRes.json();
                document.getElementById('totalSources').textContent = sourcesData.length || 0;
            } catch (e) {
                console.error('Failed to load stats', e);
            }
        }
        
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function scanSource(id) {
            if (isScanning) {
                alert('⏳ 正在扫描中，请等待完成后再试');
                return;
            }
            
            try {
                isScanning = true;
                updateScanButtons(true);
                startScanStatusCheck();
                
                const res = await fetch(`${API_BASE}/scan/source/${id}`, { method: 'POST' });
                const result = await res.json();
                
                if (result.message && result.message.includes('does not exist')) {
                    alert(`❌ 扫描失败！\n\n${result.message}\n\n提示：\n1. 确认路径是否正确\n2. Docker用户：检查是否已在 docker-compose.yml 中挂载目录\n3. 本地运行：确认目录是否存在且有读取权限`);
                } else {
                    alert(`✅ 扫描完成！\n\n发现文件: ${result.found} 个\n成功导入: ${result.imported} 本书籍\n\n${result.message}\n\n💡 提示：元数据（作者、出版社等）正在后台异步提取中`);
                    loadStats();
                }
            } catch (e) {
                alert('❌ 扫描失败: ' + e.message);
            } finally {
                isScanning = false;
                updateScanButtons(false);
                stopScanStatusCheck();
            }
        }
        
        async function scanAllSources() {
            if (isScanning) {
                alert('⏳ 正在扫描中，请等待完成后再试');
                return;
            }
            
            if (!confirm('确定要扫描所有启用的书籍源吗？\n这可能需要一些时间。')) return;
            
            try {
                isScanning = true;
                updateScanButtons(true);
                startScanStatusCheck();
                
                const res = await fetch(`${API_BASE}/scan/all`, { method: 'POST' });
                const result = await res.json();
                alert(`✅ 批量扫描完成！\n\n发现文件: ${result.found} 个\n成功导入: ${result.imported} 本书籍\n\n💡 提示：元数据（作者、出版社等）正在后台异步提取中`);
                loadStats();
            } catch (e) {
                alert('❌ 扫描失败: ' + e.message);
            } finally {
                isScanning = false;
                updateScanButtons(false);
                stopScanStatusCheck();
            }
        }
        
        // Check scan status periodically
        async function checkScanStatus() {
            try {
                const res = await fetch(`${API_BASE}/scan/status`);
                const status = await res.json();
                
                if (status.scanning && !isScanning) {
                    isScanning = true;
                    updateScanButtons(true);
                } else if (!status.scanning && isScanning) {
                    isScanning = false;
                    updateScanButtons(false);
                    loadStats(); // Refresh stats when scan completes
                }
                
                // Update individual source scan status
                Object.entries(status.sourceStatuses || {}).forEach(([sourceId, sourceStatus]) => {
                    updateSourceScanStatus(parseInt(sourceId), sourceStatus);
                });
            } catch (e) {
                console.error('Failed to check scan status:', e);
            }
        }
        
        function startScanStatusCheck() {
            if (!scanStatusCheckInterval) {
                scanStatusCheckInterval = setInterval(checkScanStatus, 2000); // Check every 2 seconds
            }
        }
        
        function stopScanStatusCheck() {
            if (scanStatusCheckInterval) {
                clearInterval(scanStatusCheckInterval);
                scanStatusCheckInterval = null;
            }
        }
        
        function updateScanButtons(scanning) {
            const scanAllBtn = document.querySelector('.scan-all-btn');
            const scanBtns = document.querySelectorAll('.scan-btn');
            
            scanBtns.forEach(btn => {
                btn.disabled = scanning;
                if (scanning) {
                    btn.classList.add('scanning');
                    btn.textContent = '⏳ 扫描中...';
                } else {
                    btn.classList.remove('scanning');
                    if (btn.classList.contains('scan-all-btn')) {
                        btn.textContent = '🔍 扫描所有书籍源';
                    } else {
                        btn.textContent = '🔍 扫描';
                    }
                }
            });
        }
        
        function updateSourceScanStatus(sourceId, status) {
            const sourceItem = document.querySelector(`[data-source-id="${sourceId}"]`);
            if (sourceItem) {
                const sourceName = sourceItem.querySelector('.source-name');
                let statusBadge = sourceName.querySelector('.scanning-status');
                
                if (status.scanning) {
                    if (!statusBadge) {
                        statusBadge = document.createElement('span');
                        statusBadge.className = 'scanning-status';
                        sourceName.appendChild(statusBadge);
                    }
                    statusBadge.textContent = `⏳ 扫描中: ${status.found}/${status.imported}`;
                } else if (statusBadge) {
                    statusBadge.remove();
                }
            }
        }
        
        async function deleteSource(id) {
            if (!confirm('确定要删除这个书籍源吗？\n删除后将无法恢复。')) return;
            try {
                const res = await fetch(`${API_BASE}/sources/${id}`, { method: 'DELETE' });
                if (res.ok || res.status === 204) {
                    alert('✅ 删除成功');
                    loadSourcesModal(); // Refresh modal if open
                    loadStats();
                } else {
                    alert('❌ 删除失败');
                }
            } catch (e) {
                alert('❌ 删除失败: ' + e.message);
            }
        }
        
        async function toggleSource(id) {
            try {
                const res = await fetch(`${API_BASE}/sources/${id}/toggle`, { method: 'POST' });
                if (res.ok) {
                    alert('✅ 操作成功');
                    loadSourcesModal(); // Refresh modal if open
                } else {
                    alert('❌ 操作失败');
                }
            } catch (e) {
                alert('❌ 操作失败: ' + e.message);
            }
        }
        
        document.getElementById('addSourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('sourceName').value.trim();
            const path = document.getElementById('sourcePath').value.trim();
            
            if (!name || !path) {
                alert('❌ 请填写完整信息');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/sources`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, path })
                });
                
                if (res.ok) {
                    alert('✅ 添加成功！\n\n提示：点击"📁 书籍源"卡片，然后点击"🔍 扫描"按钮开始导入书籍。');
                    document.getElementById('addSourceForm').reset();
                    document.getElementById('pathPreview').style.display = 'none';
                    loadStats(); // Update source count
                } else {
                    const error = await res.json().catch(() => ({}));
                    alert('❌ 添加失败: ' + (error.error || '未知错误'));
                }
            } catch (e) {
                alert('❌ 添加失败: ' + e.message);
            }
        });
        
        // 点击模态框外部关闭
        document.getElementById('fileBrowserModal').addEventListener('click', (e) => {
            if (e.target.id === 'fileBrowserModal') {
                closeFileBrowser();
            }
        });
        
        document.getElementById('bookSourcesModal').addEventListener('click', (e) => {
            if (e.target.id === 'bookSourcesModal') {
                closeBookSourcesModal();
            }
        });
        
        document.getElementById('allBooksModal').addEventListener('click', (e) => {
            if (e.target.id === 'allBooksModal') {
                closeAllBooksModal();
            }
        });
        
        // 展开/收起书籍列表
        async function toggleBooks(sourceId) {
            const booksDiv = document.getElementById(`books-${sourceId}`);
            const icon = document.getElementById(`icon-${sourceId}`);
            
            if (booksDiv.classList.contains('expanded')) {
                booksDiv.classList.remove('expanded');
                icon.classList.remove('expanded');
            } else {
                booksDiv.classList.add('expanded');
                icon.classList.add('expanded');
                
                // 加载该源的书籍
                if (!booksDiv.dataset.loaded) {
                    await loadSourceBooks(sourceId);
                    booksDiv.dataset.loaded = 'true';
                }
            }
        }
        
        async function loadSourceBooks(sourceId) {
            const booksDiv = document.getElementById(`books-${sourceId}`);
            
            try {
                // Use the count API to get total books for this source
                const countRes = await fetch(`${API_BASE}/books/count?sourceId=${sourceId}`);
                const countData = await countRes.json();
                const totalBooks = countData.count || 0;
                
                if (totalBooks === 0) {
                    booksDiv.innerHTML = '<div style="color: #999; padding: 20px; text-align: center;">📭 该书籍源暂无书籍</div>';
                    return;
                }
                
                // Fetch all books for this source
                const res = await fetch(`${API_BASE}/books?sourceId=${sourceId}&limit=1000`);
                const data = await res.json();
                const allBooks = data.books || [];
                
                if (allBooks.length > 0) {
                    const bookListHtml = `
                        <div style="color: #666; font-size: 13px; margin-bottom: 8px;">
                            📚 共 ${totalBooks} 本书籍
                        </div>
                        <ul class="book-list">
                            ${allBooks.map(book => `
                                <li class="book-item">
                                    <div class="book-title">📖 ${escapeHtml(book.title)}</div>
                                    <div class="book-meta">
                                        ${book.author ? `作者: ${escapeHtml(book.author)} | ` : ''}
                                        格式: ${escapeHtml(book.format)} | 
                                        大小: ${formatFileSize(book.fileSize)}
                                        ${book.isbn ? ` | ISBN: ${escapeHtml(book.isbn)}` : ''}
                                        ${book.publisher ? ` | 出版社: ${escapeHtml(book.publisher)}` : ''}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                    booksDiv.innerHTML = bookListHtml;
                } else {
                    booksDiv.innerHTML = '<div style="color: #999; padding: 20px; text-align: center;">📭 该书籍源暂无书籍</div>';
                }
            } catch (e) {
                booksDiv.innerHTML = `<div style="color: #dc3545; padding: 20px; text-align: center;">❌ 加载失败: ${e.message}</div>`;
            }
        }
        
        function formatFileSize(bytes) {
            if (!bytes) return '未知';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }
        
        // Initialize on page load
        loadStats();
        checkScanStatus(); // Check initial scan status
        startScanStatusCheck(); // Start periodic checking
        
        // Refresh data periodically
        setInterval(() => { loadStats(); }, 30000);
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopScanStatusCheck();
        });
    </script>
</body>
</html>
