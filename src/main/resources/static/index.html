<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookd 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: white; padding: 30px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; color: #1a1a1a; font-weight: 700; }
        .subtitle { color: #666; font-size: 14px; margin-top: 8px; }
        .section { background: white; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 20px; color: #1a1a1a; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        .docker-hint {
            background: #e7f3ff;
            border: 1px solid #2196f3;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.6;
        }
        .docker-hint code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #667eea;
        }
        .input-wrapper { position: relative; display: flex; gap: 10px; }
        input[type="text"] { 
            flex: 1; padding: 12px 16px; border: 2px solid #e1e8ed; border-radius: 8px; 
            font-size: 14px; transition: all 0.3s;
        }
        input[type="text"]:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; 
            font-size: 14px; font-weight: 600; transition: all 0.3s;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4); }
        button:active { transform: translateY(0); }
        button.browse-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); box-shadow: 0 2px 4px rgba(17, 153, 142, 0.3); }
        button.browse-btn:hover { box-shadow: 0 4px 8px rgba(17, 153, 142, 0.4); }
        button.scan-btn { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        button.scan-btn:hover { box-shadow: 0 4px 8px rgba(17, 153, 142, 0.4); }
        button.danger { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 2px 4px rgba(245, 87, 108, 0.3); }
        button.danger:hover { box-shadow: 0 4px 8px rgba(245, 87, 108, 0.4); }
        button.secondary { background: #6c757d; box-shadow: 0 2px 4px rgba(108, 117, 125, 0.3); }
        button.secondary:hover { background: #5a6268; }
        .source-list { list-style: none; }
        .source-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; border: 2px solid #f0f2f5; border-radius: 12px; 
            margin-bottom: 12px; transition: all 0.3s; background: #fafbfc;
        }
        .source-item:hover { border-color: #667eea; transform: translateX(4px); box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15); }
        .source-info { flex: 1; }
        .source-name { font-weight: 600; margin-bottom: 8px; font-size: 16px; color: #1a1a1a; }
        .source-path { 
            color: #666; font-size: 13px; font-family: 'Courier New', monospace;
            background: #f5f7fa; padding: 4px 8px; border-radius: 4px; display: inline-block;
        }
        .source-actions { display: flex; gap: 10px; align-items: center; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; margin-left: 8px; }
        .status-enabled { background: #d4edda; color: #155724; }
        .status-disabled { background: #f8d7da; color: #721c24; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
        .stat-value { font-size: 42px; font-weight: 700; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stat-label { color: #666; font-size: 14px; margin-top: 8px; font-weight: 500; }
        .empty-state { padding: 60px 40px; text-align: center; color: #999; }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
        .path-preview { font-size: 12px; color: #666; margin-top: 4px; font-style: italic; }
        .scan-all-btn { margin-bottom: 16px; }
        
        /* 文件浏览器样式 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 800px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; border-bottom: 1px solid #e1e8ed; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: none; color: #666; font-size: 24px; padding: 0; width: 32px; height: 32px; border-radius: 50%; }
        .modal-close:hover { background: #f0f2f5; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 12px; background: #f5f7fa; border-radius: 8px; font-size: 13px; font-family: 'Courier New', monospace; }
        .breadcrumb-item { color: #667eea; cursor: pointer; }
        .breadcrumb-item:hover { text-decoration: underline; }
        .breadcrumb-separator { color: #999; }
        .file-list { list-style: none; }
        .file-item { display: flex; align-items: center; padding: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .file-item:hover { background: #f5f7fa; }
        .file-item.directory { font-weight: 500; }
        .file-icon { font-size: 20px; margin-right: 12px; }
        .file-name { flex: 1; }
        .file-select-btn { padding: 6px 16px; font-size: 13px; }
        .loading { text-align: center; padding: 40px; color: #999; }
        
        @media (max-width: 768px) {
            .source-item { flex-direction: column; gap: 16px; align-items: flex-start; }
            .source-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Bookd 电子书管理后台</h1>
            <div class="subtitle">轻松管理您的电子书库</div>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalBooks">0</div>
                <div class="stat-label">📖 图书总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSources">0</div>
                <div class="stat-label">📁 书籍源</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📁 添加书籍源</h2>
            <form id="addSourceForm">
                <div class="form-group">
                    <label>源名称</label>
                    <input type="text" id="sourceName" placeholder="例如：个人收藏、技术书籍、小说..." required>
                </div>
                <div class="form-group">
                    <label>文件路径</label>
                    <div class="docker-hint">
                        💡 <strong>NAS 用户提示：</strong> 
                        如已挂载整个 NAS 目录（如 <code>/volume1</code>），可直接浏览选择任意路径。
                        点击"📂 浏览文件夹"打开文件浏览器。
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="sourcePath" placeholder="/volume1/books  或  /data/books" required readonly>
                        <button type="button" class="browse-btn" onclick="openFileBrowser()">📂 浏览文件夹</button>
                    </div>
                    <div class="path-preview" id="pathPreview" style="display: none;"></div>
                </div>
                <button type="submit">➕ 添加书籍源</button>
            </form>
        </div>
        
        <div class="section">
            <h2>📚 书籍源列表</h2>
            <button class="scan-btn scan-all-btn" onclick="scanAllSources()">🔍 扫描所有书籍源</button>
            <ul class="source-list" id="sourceList">
                <li class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div>加载中...</div>
                </li>
            </ul>
        </div>
    </div>
    
    <!-- 文件浏览器模态框 -->
    <div id="fileBrowserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">📂 选择文件夹</div>
                <button class="modal-close" onclick="closeFileBrowser()">×</button>
            </div>
            <div class="modal-body">
                <div class="breadcrumb" id="breadcrumb"></div>
                <div id="fileListContainer">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api';
        let currentPath = '/';
        
        function openFileBrowser() {
            document.getElementById('fileBrowserModal').classList.add('active');
            loadDirectory('/');
        }
        
        function closeFileBrowser() {
            document.getElementById('fileBrowserModal').classList.remove('active');
        }
        
        async function loadDirectory(path) {
            currentPath = path;
            const container = document.getElementById('fileListContainer');
            container.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const res = await fetch(`${API_BASE}/filesystem/list?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                
                // 更新面包屑
                updateBreadcrumb(data.currentPath);
                
                // 渲染文件列表
                const fileList = document.createElement('ul');
                fileList.className = 'file-list';
                
                // 添加返回上级
                if (data.parentPath) {
                    const parentItem = createFileItem({
                        name: '..',
                        path: data.parentPath,
                        isDirectory: true
                    }, true);
                    fileList.appendChild(parentItem);
                }
                
                // 添加目录
                data.directories.forEach(dir => {
                    fileList.appendChild(createFileItem(dir, false));
                });
                
                container.innerHTML = '';
                container.appendChild(fileList);
                
                if (data.directories.length === 0 && !data.parentPath) {
                    container.innerHTML = '<div class="empty-state"><div>该目录为空</div></div>';
                }
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><div style="color: #dc3545;">加载失败: ${e.message}</div></div>`;
            }
        }
        
        function createFileItem(item, isParent) {
            const li = document.createElement('li');
            li.className = 'file-item directory';
            
            const icon = document.createElement('span');
            icon.className = 'file-icon';
            icon.textContent = isParent ? '⬆️' : '📁';
            
            const name = document.createElement('span');
            name.className = 'file-name';
            name.textContent = item.name;
            
            const selectBtn = document.createElement('button');
            selectBtn.className = 'file-select-btn';
            selectBtn.textContent = '选择';
            selectBtn.onclick = (e) => {
                e.stopPropagation();
                selectPath(item.path);
            };
            
            li.appendChild(icon);
            li.appendChild(name);
            if (!isParent) {
                li.appendChild(selectBtn);
            }
            
            li.onclick = () => {
                if (item.isDirectory) {
                    loadDirectory(item.path);
                }
            };
            
            return li;
        }
        
        function updateBreadcrumb(path) {
            const breadcrumb = document.getElementById('breadcrumb');
            const parts = path.split('/').filter(p => p);
            
            let html = '<span class="breadcrumb-item" onclick="loadDirectory(\'/\')">根目录</span>';
            
            let accumulated = '';
            parts.forEach((part, index) => {
                accumulated += '/' + part;
                const currentPath = accumulated;
                html += '<span class="breadcrumb-separator">/</span>';
                html += `<span class="breadcrumb-item" onclick="loadDirectory('${currentPath}')">${part}</span>`;
            });
            
            breadcrumb.innerHTML = html;
        }
        
        function selectPath(path) {
            document.getElementById('sourcePath').value = path;
            closeFileBrowser();
            
            const preview = document.getElementById('pathPreview');
            preview.textContent = `✅ 已选择: ${path}`;
            preview.style.display = 'block';
            preview.style.color = '#28a745';
        }
        
        async function loadStats() {
            try {
                const booksRes = await fetch(`${API_BASE}/books`);
                const booksData = await booksRes.json();
                document.getElementById('totalBooks').textContent = booksData.total || 0;
                
                const sourcesRes = await fetch(`${API_BASE}/sources`);
                const sourcesData = await sourcesRes.json();
                document.getElementById('totalSources').textContent = sourcesData.length || 0;
            } catch (e) {
                console.error('Failed to load stats', e);
            }
        }
        
        async function loadSources() {
            try {
                const res = await fetch(`${API_BASE}/sources`);
                const sources = await res.json();
                const list = document.getElementById('sourceList');
                
                if (sources.length === 0) {
                    list.innerHTML = `<li class="empty-state"><div class="empty-state-icon">📭</div><div>暂无书籍源，请添加第一个书籍源</div></li>`;
                    return;
                }
                
                list.innerHTML = sources.map(source => `
                    <li class="source-item">
                        <div class="source-info">
                            <div class="source-name">
                                ${escapeHtml(source.name)}
                                <span class="status-badge ${source.enabled ? 'status-enabled' : 'status-disabled'}">
                                    ${source.enabled ? '✓ 已启用' : '✗ 已禁用'}
                                </span>
                            </div>
                            <div class="source-path">${escapeHtml(source.path)}</div>
                        </div>
                        <div class="source-actions">
                            <button class="scan-btn" onclick="scanSource(${source.id})">🔍 扫描</button>
                            <button class="secondary" onclick="toggleSource(${source.id})">
                                ${source.enabled ? '⏸ 禁用' : '▶ 启用'}
                            </button>
                            <button class="danger" onclick="deleteSource(${source.id})">🗑️ 删除</button>
                        </div>
                    </li>
                `).join('');
            } catch (e) {
                console.error('Failed to load sources', e);
                list.innerHTML = `<li class="empty-state"><div class="empty-state-icon">⚠️</div><div style="color: #dc3545;">加载失败，请刷新重试</div></li>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function scanSource(id) {
            try {
                const res = await fetch(`${API_BASE}/scan/source/${id}`, { method: 'POST' });
                const result = await res.json();
                
                if (result.message && result.message.includes('does not exist')) {
                    alert(`❌ 扫描失败！\n\n${result.message}\n\n提示：\n1. 确认路径是否正确\n2. Docker用户：检查是否已在 docker-compose.yml 中挂载目录\n3. 本地运行：确认目录是否存在且有读取权限`);
                } else {
                    alert(`✅ 扫描完成！\n\n发现文件: ${result.found} 个\n成功导入: ${result.imported} 本书籍\n\n${result.message}`);
                    loadStats();
                }
            } catch (e) {
                alert('❌ 扫描失败: ' + e.message);
            }
        }
        
        async function scanAllSources() {
            if (!confirm('确定要扫描所有启用的书籍源吗？\n这可能需要一些时间。')) return;
            
            try {
                const res = await fetch(`${API_BASE}/scan/all`, { method: 'POST' });
                const result = await res.json();
                alert(`✅ 批量扫描完成！\n\n发现文件: ${result.found} 个\n成功导入: ${result.imported} 本书籍`);
                loadStats();
            } catch (e) {
                alert('❌ 扫描失败: ' + e.message);
            }
        }
        
        async function deleteSource(id) {
            if (!confirm('确定要删除这个书籍源吗？\n删除后将无法恢复。')) return;
            try {
                const res = await fetch(`${API_BASE}/sources/${id}`, { method: 'DELETE' });
                if (res.ok || res.status === 204) {
                    alert('✅ 删除成功');
                    loadSources();
                    loadStats();
                } else {
                    alert('❌ 删除失败');
                }
            } catch (e) {
                alert('❌ 删除失败: ' + e.message);
            }
        }
        
        async function toggleSource(id) {
            try {
                const res = await fetch(`${API_BASE}/sources/${id}/toggle`, { method: 'POST' });
                if (res.ok) {
                    alert('✅ 操作成功');
                    loadSources();
                } else {
                    alert('❌ 操作失败');
                }
            } catch (e) {
                alert('❌ 操作失败: ' + e.message);
            }
        }
        
        document.getElementById('addSourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('sourceName').value.trim();
            const path = document.getElementById('sourcePath').value.trim();
            
            if (!name || !path) {
                alert('❌ 请填写完整信息');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/sources`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, path })
                });
                
                if (res.ok) {
                    alert('✅ 添加成功！\n\n提示：点击"🔍 扫描"按钮开始导入书籍。');
                    document.getElementById('addSourceForm').reset();
                    document.getElementById('pathPreview').style.display = 'none';
                    loadSources();
                    loadStats();
                } else {
                    const error = await res.json().catch(() => ({}));
                    alert('❌ 添加失败: ' + (error.error || '未知错误'));
                }
            } catch (e) {
                alert('❌ 添加失败: ' + e.message);
            }
        });
        
        // 点击模态框外部关闭
        document.getElementById('fileBrowserModal').addEventListener('click', (e) => {
            if (e.target.id === 'fileBrowserModal') {
                closeFileBrowser();
            }
        });
        
        loadStats();
        loadSources();
        setInterval(() => { loadStats(); loadSources(); }, 30000);
    </script>
</body>
</html>
