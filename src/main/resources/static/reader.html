<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookd 阅读器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 60px 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            color: #1a1a1a;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .user-info {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .user-info .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .user-info .value {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .role-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-left: 12px;
        }
        .role-user {
            background: #d4edda;
            color: #155724;
        }
        .role-guest {
            background: #e2e3e5;
            color: #383d41;
        }
        .feature-list {
            text-align: left;
            margin: 30px 0;
            padding: 0;
            list-style: none;
        }
        .feature-item {
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .feature-icon {
            font-size: 24px;
            flex-shrink: 0;
        }
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 40px;
        }
        button {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        .coming-soon {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📚</div>
        <h1>Bookd 电子书阅读器</h1>
        <p class="subtitle">欢迎回来！</p>
        
        <div class="user-info">
            <div class="label">当前登录</div>
            <div class="value" id="username">
                加载中...
            </div>
        </div>
        
        <div class="coming-soon">🚧 功能开发中 🚧</div>
        
        <ul class="feature-list">
            <li class="feature-item">
                <span class="feature-icon">📖</span>
                <span>在线阅读电子书（EPUB、TXT）</span>
            </li>
            <li class="feature-item">
                <span class="feature-icon">🔖</span>
                <span>跨设备同步阅读进度和书签</span>
            </li>
            <li class="feature-item">
                <span class="feature-icon">🎨</span>
                <span>自定义阅读主题和字体大小</span>
            </li>
            <li class="feature-item">
                <span class="feature-icon">📱</span>
                <span>Compose 跨平台客户端（Android、iOS、Desktop）</span>
            </li>
        </ul>
        
        <div class="button-group">
            <button class="btn-secondary" onclick="logout()">退出登录</button>
        </div>
    </div>

    <script>
        const authToken = localStorage.getItem('authToken');
        
        async function checkAuth() {
            if (!authToken) {
                window.location.href = '/login';
                return;
            }
            
            try {
                const res = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    const user = await res.json();
                    displayUserInfo(user);
                } else {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('user');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/login';
            }
        }
        
        function displayUserInfo(user) {
            const roleText = user.role === 'user' ? '普通用户' : '访客';
            const roleBadgeClass = user.role === 'user' ? 'role-user' : 'role-guest';
            
            document.getElementById('username').innerHTML = `
                ${user.username}
                <span class="role-badge ${roleBadgeClass}">${roleText}</span>
            `;
        }
        
        function logout() {
            fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${authToken}` }
            }).finally(() => {
                localStorage.removeItem('authToken');
                localStorage.removeItem('user');
                window.location.href = '/login';
            });
        }
        
        // Check auth on page load
        checkAuth();
    </script>
</body>
</html>
