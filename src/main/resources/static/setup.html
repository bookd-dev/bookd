<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookd 初始化设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .setup-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 50px 40px;
            width: 100%;
            max-width: 500px;
        }
        .icon {
            font-size: 80px;
            text-align: center;
            margin-bottom: 30px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #1a1a1a;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .welcome-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .required {
            color: #f5576c;
            margin-left: 4px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .hint {
            font-size: 13px;
            color: #999;
            margin-top: 6px;
        }
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        button[type="submit"]:active {
            transform: translateY(0);
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .features {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #e1e8ed;
        }
        .features h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 16px;
            text-align: center;
        }
        .feature-list {
            list-style: none;
            padding: 0;
        }
        .feature-item {
            padding: 8px 0;
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="icon">🚀</div>
        <h1>欢迎使用 Bookd</h1>
        <p class="subtitle">首次设置 - 创建管理员账号</p>
        
        <div class="welcome-message">
            👋 这是您第一次启动 Bookd！<br>
            让我们先创建一个管理员账号，您将获得完整的系统管理权限。
        </div>
        
        <div id="error" class="error"></div>
        
        <form id="setup-form">
            <div class="form-group">
                <label>
                    用户名<span class="required">*</span>
                </label>
                <input type="text" name="username" required autocomplete="username" placeholder="输入管理员用户名">
                <div class="hint">用于登录系统，建议使用易记的名称</div>
            </div>
            
            <div class="form-group">
                <label>
                    密码<span class="required">*</span>
                </label>
                <input type="password" name="password" required autocomplete="new-password" placeholder="输入密码">
                <div class="hint">至少6个字符，建议使用强密码</div>
            </div>
            
            <div class="form-group">
                <label>
                    确认密码<span class="required">*</span>
                </label>
                <input type="password" name="confirmPassword" required autocomplete="new-password" placeholder="再次输入密码">
            </div>
            
            <div class="form-group">
                <label>邮箱（可选）</label>
                <input type="email" name="email" autocomplete="email" placeholder="用于找回密码等功能">
            </div>
            
            <button type="submit">🎉 创建管理员并开始使用</button>
        </form>
        
        <div class="features">
            <h3>✨ 管理员可以做什么？</h3>
            <ul class="feature-list">
                <li class="feature-item">
                    <span class="feature-icon">📁</span>
                    <span>管理书籍源和扫描电子书</span>
                </li>
                <li class="feature-item">
                    <span class="feature-icon">👥</span>
                    <span>创建和管理其他用户</span>
                </li>
                <li class="feature-item">
                    <span class="feature-icon">🎫</span>
                    <span>生成邀请码供他人注册</span>
                </li>
                <li class="feature-item">
                    <span class="feature-icon">⚙️</span>
                    <span>配置系统设置和权限</span>
                </li>
            </ul>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script>
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        // Setup form
        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const formData = new FormData(e.target);
            const username = formData.get('username');
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            const email = formData.get('email');
            
            // Validation
            if (!username || username.length < 3) {
                showError('用户名至少需要3个字符');
                return;
            }
            
            if (!password || password.length < 6) {
                showError('密码至少需要6个字符');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }
            
            const data = {
                username: username,
                password: password,
                email: email || null
            };

            try {
                await api.post('/api/auth/setup', data);
                alert('🎉 管理员创建成功！\n\n即将跳转到登录页面。');
                window.location.href = '/login';
            } catch (error) {
                showError(error.message || '创建失败');
            }
        });
    </script>
</body>
</html>
