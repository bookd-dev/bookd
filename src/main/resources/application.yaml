ktor:
  application:
    modules:
      - com.bookd.ApplicationKt.module
  deployment:
    port: ${PORT:8080}
    host: 0.0.0.0

database:
  url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/bookd}
  driver: "org.postgresql.Driver"
  user: ${DATABASE_USER:bookd}
  password: ${DATABASE_PASSWORD:bookd}

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
  enabled: ${REDIS_ENABLED:true}

app:
  scan:
    directories:
      - "/data/books"
    formats:
      - "txt"
      - "epub"
      - "mobi"
      - "azw3"
  parse:
    autoParseOnScan: false  # 扫描时不自动解析章节
    backgroundParseEnabled: true  # 启用后台解析
    backgroundParseInterval: 60  # 后台解析间隔(秒)
    backgroundParseBatchSize: 5  # 每次处理的书籍数量
